name: Node checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check source syntax
        run: |
          node --check src/pool.js
          node --check src/database.js
          node --check src/server.js
      - name: Run tests
        run: node --test test/*.test.js
