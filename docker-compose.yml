services:
  volume-init:
    build: .
    image: nekoroute:local
    container_name: nekoroute-volume-init
    user: "0:0"
    command: ["sh", "-c", "mkdir -p /app/data && chown -R 1000:1000 /app/data"]
    volumes:
      - proxy_data:/app/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    restart: "no"

  nekoroute:
    build: .
    image: nekoroute:local
    container_name: nekoroute
    restart: unless-stopped
    depends_on:
      volume-init:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      # Prefer IPv4 when a Docker host advertises unusable IPv6 DNS results.
      NODE_OPTIONS: --dns-result-order=ipv4first
    ports:
      - "3210:3210"
      - "1080:1080"
      - "8080:8080"
      - "8443:8443"
    volumes:
      - proxy_data:/app/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=64m,mode=1777
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3210/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  proxy_data:
